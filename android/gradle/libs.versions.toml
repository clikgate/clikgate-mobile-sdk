[versions]
# AGP and Kotlin match the Flutter 3.35 plugin/app templates so the :clikgate build can be
# included in a Flutter app's Gradle build (composite build) without plugin version clashes.
agp = "8.9.1"
kotlin = "2.1.0"
installreferrer = "2.2"
androidx-core = "1.16.0"
# Last WorkManager / lifecycle lines that still support minSdk 21 (2.11 / 2.10 need 23).
work = "2.10.5"
lifecycle = "2.9.4"
play-integrity = "1.6.0"
play-services-tasks = "18.2.0"
junit = "4.13.2"
robolectric = "4.16"
mockwebserver = "4.12.0"
androidx-test-core = "1.6.1"
androidx-test-ext = "1.2.1"
androidx-test-runner = "1.6.2"
work-testing = "2.10.5"
coroutines = "1.10.2"
vanniktech-publish = "0.34.0"
# Public-API snapshots (api/*.api), checked by `apiCheck` (part of `check`).
binary-compatibility-validator = "0.17.0"
firebase-bom = "35.0.2"
appcompat = "1.7.1"

[libraries]
installreferrer = { module = "com.android.installreferrer:installreferrer", version.ref = "installreferrer" }
androidx-core = { module = "androidx.core:core", version.ref = "androidx-core" }
work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
play-integrity = { module = "com.google.android.play:integrity", version.ref = "play-integrity" }
play-services-tasks = { module = "com.google.android.gms:play-services-tasks", version.ref = "play-services-tasks" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "mockwebserver" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
work-testing = { module = "androidx.work:work-testing", version.ref = "work-testing" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
# Sample only: shows client-side Firebase forwarding (the SDK finds Firebase Analytics by reflection).
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
vanniktech-publish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech-publish" }
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binary-compatibility-validator" }
