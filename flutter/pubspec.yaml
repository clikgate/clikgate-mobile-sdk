name: clikgate_flutter
description: "Clikgate SDK for Flutter: deep links that open the right screen (even after install), install attribution, goals, referrals, identity and Engage (referral links, leaderboards, share) for Android and iOS apps."
version: 2.1.0
homepage: https://clikgate.com
repository: https://github.com/clikgate/clikgate-mobile-sdk/tree/main/flutter
issue_tracker: https://github.com/clikgate/clikgate-mobile-sdk/issues
topics:
  - deep-linking
  - attribution
  - analytics
  - referral
  - marketing

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  # Engage features (package:clikgate_flutter/engage.dart, since 2.1.0; was the clikgate_engage package).
  http: ^1.2.2
  # dart run clikgate_flutter:setup verifies the downloaded setup command (SHA-256).
  crypto: ^3.0.3
  meta: ^1.15.0
  # Same line as the example app's pin (contemporary with Flutter 3.35).
  share_plus: '>=12.0.0 <13.0.0'
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Public-API snapshot test (syntactic parse only).
  analyzer: '>=7.4.0 <9.0.0'

flutter:
  plugin:
    platforms:
      android:
        package: com.clikgate.clikgate_flutter
        pluginClass: ClikgateFlutterPlugin
      ios:
        pluginClass: ClikgateFlutterPlugin
