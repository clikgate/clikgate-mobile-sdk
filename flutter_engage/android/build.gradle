group = "com.clikgate.clikgate_engage"
version = "2.0.0"

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.9.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

// Native Engage dependency (com.clikgate:clikgate-engage, which brings com.clikgate:clikgate-android).
//  - Releases: resolved from Maven Central.
//  - This monorepo: the example app's settings.gradle.kts includes ../../android as a composite
//    build and substitutes the modules with the :clikgate and :clikgate-engage projects.
//  - Other apps developing against an unpublished SDK: run `./gradlew publishToMavenLocal` in
//    android/ and set `clikgate.useMavenLocal=true` in the app's android/gradle.properties.
def clikgateAndroidVersion = project.findProperty("clikgate.androidVersion") ?: "2.0.0"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

if (project.findProperty("clikgate.useMavenLocal") == "true") {
    rootProject.allprojects {
        repositories {
            mavenLocal {
                content { includeGroup("com.clikgate") }
            }
        }
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.clikgate.clikgate_engage"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdk = 21
    }
}

dependencies {
    implementation("com.clikgate:clikgate-engage:$clikgateAndroidVersion")
}
