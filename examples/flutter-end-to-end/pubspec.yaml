name: clikgate_end_to_end
description: "Clikgate end-to-end sample app: deep links, sign-in with identity, goals, payments and referrals, with one of the sample backends."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  # The plugin from this repository (see README.md). At release: clikgate_flutter: ^2.1.6
  clikgate_flutter:
    path: ../../flutter
  dio: ^5.9.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # MockClient for the Engage HTTP calls in tests.
  http: ^1.2.2

flutter:
  uses-material-design: true
