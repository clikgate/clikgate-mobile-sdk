name: SDK boundaries (core vs Engage)

# Spec v3 new edition, 0.4 / section 20: per core SDK a public-API snapshot check that also asserts
# core has no leaderboard / referral-stats / link-creation / code / share / identity-signal API,
# a dependency check (core never depends on Engage) and the size budgets
# (core Android < 150 KB, Engage Android < 44 KB, core iOS < 410 KB, Engage iOS < 95 KB; since 2.1.0 Engage ships inside each core package, measured separately), plus (Change 12) the generated Provider types check and the release scan of each package's published sources.
# Same checks locally: scripts/check_sdk_boundaries.sh

# Changes that touch only the setup command (cli/, its workflows and its version check) can't
# change an SDK's API or size, so they don't run these jobs (cli.yml covers them).
on:
  push:
    branches: [main]
    paths-ignore: ["cli/**", ".github/workflows/cli.yml", ".github/workflows/cli-release.yml", "scripts/check_cli_sdk_versions.mjs", "docs/SETUP_COMMAND.md"]
  pull_request:
    paths-ignore: ["cli/**", ".github/workflows/cli.yml", ".github/workflows/cli-release.yml", "scripts/check_cli_sdk_versions.mjs", "docs/SETUP_COMMAND.md"]

concurrency:
  group: sdk-boundaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # The default list includes the obsolete 'tools' package, which cmdline-tools 16+ no longer has.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: API snapshots, dependency check, size budgets
        run: scripts/check_sdk_boundaries.sh --only android

  ios:
    runs-on: macos-15 # has Xcode 26.x (selected below); macos-26 runners got no capacity in Nov 2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" && xcodebuild -version
      - name: API snapshots, dependency check, size budgets
        run: scripts/check_sdk_boundaries.sh --only ios

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.4"
          channel: stable
      - name: API snapshots, dependency check
        run: scripts/check_sdk_boundaries.sh --only flutter

  react-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: react-native/package-lock.json
      - name: API snapshots, dependency check
        run: scripts/check_sdk_boundaries.sh --only rn
