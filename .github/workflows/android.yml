name: Android SDK

on:
  push:
    branches: [main]
    paths: ["android/**", "shared/**", ".github/workflows/android.yml"]
    tags: ["android-v*"]
  pull_request:
    paths: ["android/**", "shared/**", ".github/workflows/android.yml"]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # The default list includes the obsolete 'tools' package, which cmdline-tools 16+ no longer has.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, core + Engage (JUnit + Robolectric + MockWebServer)
        run: ./gradlew :clikgate:testDebugUnitTest --stacktrace
      - name: Public API snapshot (binary-compatibility-validator) + core code never uses Engage
        run: ./gradlew apiCheck :clikgate:checkNoEngageDependency
      - name: Lint
        run: ./gradlew :clikgate:lintRelease
      - name: Build AARs, sample app and instrumented tests
        run: ./gradlew :clikgate:assembleRelease :sample:assembleDebug :sample:assembleDebugAndroidTest
      - name: Size budgets (core < 150 KB, Engage < 44 KB)
        run: ./scripts/check_size.sh --no-build | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            android/clikgate/build/reports/
            android/clikgate/build/outputs/aar/

  # Publishes com.clikgate:clikgate-android (with the Engage features) to Maven Central (Central Portal) on android-v* tags.
  # Secrets: MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD (Central Portal user token),
  # SIGNING_KEY (ASCII-armored private key), SIGNING_KEY_ID, SIGNING_KEY_PASSWORD.
  # The deployment is uploaded but not auto-released (automaticRelease = false): release it in
  # https://central.sonatype.com after checking it.
  # Public releases are PAUSED (owner 2026-11-08): track() is being removed and no published version may include it.
  # This job runs only when the repository variable PUBLIC_SDK_RELEASES_ENABLED is set to 'true' (unset = paused).
  release:
    if: vars.PUBLIC_SDK_RELEASES_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/android-v')
    needs: build
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # The default list includes the obsolete 'tools' package, which cmdline-tools 16+ no longer has.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Check tag matches VERSION_NAME
        run: |
          version="$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)"
          test "android-v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != android-v$version"; exit 1; }
      # Change 12, S.4: nothing internal ships (TODO/FIXME, internal docs or hosts, staff references, debug code).
      - name: Scan the release packages
        run: |
          ./gradlew :clikgate:assembleRelease :clikgate:releaseSourcesJar
          python3 ../scripts/scan_release_packages.py clikgate/build/outputs/aar/clikgate-release.aar \
            clikgate/build/libs/clikgate-sources.jar
      - name: Publish to Maven Central
        run: ./gradlew :clikgate:publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
